schema: spec-driven

# context — краткая выжимка для артефактов; полные конвенции — в AGENTS.md
context: |
  C4ModelBuilder — .NET 8: PlantUML-диаграмма C4 Component (уровень 3) из C#-кода с
  атрибутами C4Context/C4Container/C4Component/C4Code. Реализован только уровень 3;
  атрибуты C4* и публичный API — стабильный контракт без breaking-изменений.

  Границы слоёв: Models ← (Analyzer, PlantUmlCreator); Analyzer и PlantUmlCreator друг на
  друга не ссылаются; между слоями — только модели Models/Analysis (InvocationTree).

  API: SolutionAnalyzer.Create(ILogger, Solution, maxDepth, targetProject, excludeMask, ct) →
  AnalyzeComponents(ct) → InvocationTree → PlantUmlGenerator.Generate(tree) → текст PlantUML.
  Анализатор не выполняет I/O; Generate — чистая функция.

  Тесты: NUnit, сначала падающий тест, проверяется наблюдаемый результат (текст PlantUML
  или модель C4ComponentDiagram). Прочие конвенции, стиль и команды — в AGENTS.md.

# rules — только то, что нужно при создании конкретного артефакта
rules:
  proposal:
    - Включай раздел «Не входит в объём»; отмечай влияние на публичный контракт (атрибуты C4*, публичный API).
  specs:
    - Описывай наблюдаемое поведение (что генерируется), а не устройство классов; поддерживается только C4-уровень 3.
  design:
    - Фиксируй затронутые границы слоёв (Models/Analyzer/PlantUmlCreator); для новых зависимостей — обоснование и альтернативы.
  tasks:
    - Каждая задача — с проверкой (тест или команда) и объёмом на один сеанс; перед завершением — сборка и полный прогон тестов.

# operations — напоминания для apply и archive
operations:
  apply:
    guidance:
      - Не завершай работу, если dotnet build или dotnet test не зелёные.
  archive:
    guidance:
      - Кратко резюмируй итог архивации и какие capability-спеки обновились.
