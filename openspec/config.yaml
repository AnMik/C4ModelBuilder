schema: spec-driven

# context — краткая выжимка для артефактов; полные конвенции — в AGENTS.md
context: |
  C4ModelBuilder — .NET 8: PlantUML-диаграмма C4 Component (уровень 3) из C#-кода с
  атрибутами C4*. Реализован только уровень 3; остальные атрибуты объявлены и не влияют.

  Публичный контракт — атрибуты C4*, публичный API библиотеки (структура проектов решения)
  и CLI; breaking-изменения не допускаются. Поведение контракта зафиксировано спеками —
  openspec/specs/ (c4-annotation-attributes, cli-tool, component-diagram-generation).

  Границы слоёв, пайплайн, конвенции тестов и команды — в AGENTS.md.

# rules — только то, что нужно при создании конкретного артефакта
rules:
  proposal:
    - Включай раздел «Не входит в объём»; отмечай влияние на публичный контракт.
  specs:
    - Описывай наблюдаемое поведение (текст `.puml`, параметры и коды возврата CLI), а не устройство классов.
  design:
    - Фиксируй затронутые границы слоёв (Models/Analyzer/PlantUmlCreator); для новых зависимостей — обоснование и альтернативы.
  tasks:
    - Каждая задача — с проверкой (тест или команда) и объёмом на один сеанс.

# operations — напоминания для apply и archive
operations:
  apply:
    guidance:
      - Не завершай работу, если dotnet build или dotnet test не зелёные.
  archive:
    guidance:
      - Кратко резюмируй итог архивации и какие capability-спеки обновились.
